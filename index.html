<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聚合搜索</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <div class="container header-inner">
          <div class="header-top">
            <div class="title-row">
              <h1>聚合搜索</h1>
              <span class="status" id="status"></span>
            </div>
          </div>

          <div class="toolbar">
            <label class="search-box">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input id="q" type="text" placeholder="搜索名字…" autocomplete="off" />
            </label>
            <div class="filter-group" id="f-region"></div>
            <div class="filter-group" id="f-body"></div>
            <div class="filter-group" id="f-works"></div>
          </div>

          <div class="warning" id="warning" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z" />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            </svg>
            <p id="warning-text"></p>
          </div>
        </div>
      </header>

      <main class="container">
        <div id="list"></div>

        <section class="howto">
          <h2>怎么维护</h2>
          <ol>
            <li>
              关键词表.csv：名字、头像、地区、体型、社交主页链接、作品1～5（
              <code>名称|链接</code>
              ）。空单元格不显示。
            </li>
            <li>搜索引擎表.csv：站点名称 + 搜索地址，关键词位置写成 {q}。</li>
            <li>两个文件请保存为 UTF-8 编码；替换服务器上的文件后，按 F5 刷新页面即可。</li>
          </ol>
        </section>
      </main>
    </div>

    <noscript>本页面需要启用 JavaScript 才能加载数据。</noscript>
    <script src="assets/app.js"></script>
  </body>
</html>
